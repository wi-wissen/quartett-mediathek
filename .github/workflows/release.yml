name: Release

# Manual release: enter a version like 1.2.0. Builds the signed APK, tags v1.2.0 and publishes a GitHub release
# with the fixed asset name quartett-mediathek.apk, so .../releases/latest/download/quartett-mediathek.apk
# (short link https://t1p.de/qmedia) always points to the newest version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.0, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          QM_KEYSTORE_BASE64: ${{ secrets.QM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$QM_KEYSTORE_BASE64" ]; then
            echo "::error::Secret QM_KEYSTORE_BASE64 is missing. See README, section Release."
            exit 1
          fi
          echo "$QM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "QM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        env:
          QM_KEYSTORE_PASSWORD: ${{ secrets.QM_KEYSTORE_PASSWORD }}
          QM_KEY_ALIAS: ${{ secrets.QM_KEY_ALIAS }}
          QM_KEY_PASSWORD: ${{ secrets.QM_KEY_PASSWORD }}
        run: ./gradlew --console=plain :shared:jvmTest :app:assembleRelease -PappVersionName="$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk quartett-mediathek.apk
          gh release create "v$VERSION" quartett-mediathek.apk \
            --target "$GITHUB_SHA" \
            --title "Quartett Mediathek $VERSION" \
            --generate-notes
