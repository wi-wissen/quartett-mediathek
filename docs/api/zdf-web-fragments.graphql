fragment LogoImageSizes on ImageLayout {
  dim380X170
  dim760X340
  original
}

fragment TeaserLogoImage on ImagePropertyConnection {
  layouts {
    ...LogoImageSizes
  }
}

fragment TeaserContentOwner on ContentOwner {
  details
  title
}

fragment NotClickableStreamingOptions on IStreamingOptions {
  ad
  dgs
  ut
  ks
  ov
  fskMetaCollection {
    id
    canonical
    title
  }
}

fragment MetaCollectionLink on MetaCollection {
  id
  canonical
  title
  transformedValue
  structuralMetadata {
    isChildrenContent
  }
}

fragment PublicationFormMetaOnSmartCollection on ISmartCollectionStructuralMetadata {
  publicationFormMetaCollection {
    title
    transformedValue
    ...MetaCollectionLink
  }
}

fragment GenreMetaOnSmartCollection on ISmartCollectionStructuralMetadata {
  genreMetaCollection {
    title
    transformedValue
    ...MetaCollectionLink
  }
}

fragment TeaserMoodLabels on IVisualDimensions {
  moods(first: 1) {
    nodes {
      level
      mood
    }
  }
}

fragment VideoSmartCollectionData on ISmartCollection {
  id
  title
  canonical
  collectionType
  editorialDate
  isCampaign
  logo {
    ...TeaserLogoImage
  }
  teaser {
    title
  }
  contentOwner {
    ...TeaserContentOwner
  }
  streamingOptions {
    ...NotClickableStreamingOptions
  }
  structuralMetadata {
    isChildrenContent
    ...PublicationFormMetaOnSmartCollection
    ...GenreMetaOnSmartCollection
    visualDimension {
      ...TeaserMoodLabels
    }
  }
}

fragment LiveMediaFragment on LiveMedia {
  ... on LiveMedia {
    liveMediaType
    plannedStart
    plannedStop
    editorialStart
    editorialStop
    start
    stop
    state
    tvService
    geoLocation
  }
}

fragment VodMediaFragment on VodMedia {
  ... on VodMedia {
    vodMediaType
    duration
    downloadAllowed
    streamAnchorTags {
      nodes {
        anchorLabel
        anchorOffset
      }
    }
    geoLocation
  }
}

fragment CurrentMedia on VideoCurrentMediaConnection {
  nodes {
    ptmdTemplate
    ...LiveMediaFragment
    ...VodMediaFragment
  }
}

fragment ScheduledMedia on ScheduledMedia {
  videoType
  availableFrom
  availableTo
  editorialStart
  editorialStop
}

fragment TeaserImageSizes on ImageLayout {
  dim276X311
  dim384X216
  dim640X720
  dim768X432
  original
}

fragment TeaserImage on ImagePropertyConnection {
  layouts {
    ...TeaserImageSizes
  }
}

fragment PublicationFormMetaOnVideo on VideoStructuralMetadata {
  publicationFormMetaCollection {
    title
    transformedValue
    ...MetaCollectionLink
  }
}

fragment GenreMetaOnVideo on VideoStructuralMetadata {
  genreMetaCollection {
    title
    transformedValue
    ...MetaCollectionLink
  }
}

fragment VideoTeaserData on Video {
  id
  title
  canonical
  newVideoContentStatus: newContentStatus
  episodeInfo {
    episodeNumber
    seasonNumber
  }
  smartCollection {
    ...VideoSmartCollectionData
  }
  currentMedia {
    ...CurrentMedia
  }
  currentMediaType
  contentType
  scheduledMedia {
    ...ScheduledMedia
  }
  editorialDate
  teaser {
    title
    imageWithoutLogo {
      ...TeaserImage
    }
    sourceVariant
    enableAudioDescription
    enableSubtitle
    streamAnchorTagId
    externalStreamAnchorTag {
      sceneId
      showEventHighlights
      duration
    }
  }
  structuralMetadata {
    isChildrenContent
    ...PublicationFormMetaOnVideo
    ...GenreMetaOnVideo
    visualDimension {
      ...TeaserMoodLabels
    }
  }
  streamingOptions {
    ...NotClickableStreamingOptions
  }
  contentOwner {
    ...TeaserContentOwner
  }
  availability {
    fskBlocked
    vod {
      visibleTo
      endDate
      fsk
    }
    broadcast {
      effectiveAirtimeBegin
      effectiveAirtimeEnd
    }
  }
  tracking {
    piano(filter: click)
  }
}

fragment ResponseMetadataFragment on Query {
  responseMetadata @client {
    cacheRefresh
    cacheStatus
  }
}

fragment TeaserBackgroundVideo on Video {
  id
  canonical
  structuralMetadata {
    isChildrenContent
  }
  availability {
    fskBlocked
    vod {
      fsk
    }
  }
  currentMedia {
    ...CurrentMedia
  }
}

fragment NotificationFragment on Video {
  id
  title
  editorialDate
  canonical
  teaser {
    imageWithoutLogo {
      ...TeaserImage
    }
  }
  smartCollection {
    id
    title
    canonical
    structuralMetadata {
      ...PublicationFormMetaOnSmartCollection
    }
  }
  structuralMetadata {
    isChildrenContent
  }
  currentMedia {
    nodes {
      ... on VodMedia {
        geoLocation
      }
      ... on LiveMedia {
        plannedStart
        editorialStart
        editorialStop
        start
        stop
        state
        geoLocation
      }
    }
  }
  availability {
    fskBlocked
    vod {
      fsk
      visibleTo
      visible
      endDate
    }
  }
}

fragment ISmartCollectionTeaserData on ISmartCollection {
  id
  title
  canonical
  collectionType
  editorialDate
  endDate
  isCampaign
  logo {
    ...TeaserLogoImage
  }
  teaser {
    title
    imageWithoutLogo {
      ...TeaserImage
    }
  }
  contentOwner {
    ...TeaserContentOwner
  }
  streamingOptions {
    ...NotClickableStreamingOptions
  }
  newContentStatus
  structuralMetadata {
    isChildrenContent
    ...PublicationFormMetaOnSmartCollection
    ...GenreMetaOnSmartCollection
    visualDimension {
      ...TeaserMoodLabels
    }
  }
  heroTrailers: trailers(first: 1, sortBy: {field: HERO_TRAILER, direction: DESC}) {
    nodes {
      ...TeaserBackgroundVideo
    }
  }
  tracking {
    piano(filter: click)
  }
  ... on ISeriesSmartCollection {
    countSeasons
    countEpisodes
  }
  ... on MovieSmartCollection {
    teaser {
      sourceVariant
      enableAudioDescription
      enableSubtitle
    }
    video {
      id
      canonical
      structuralMetadata {
        isChildrenContent
      }
      availability {
        fskBlocked
        vod {
          visibleTo
          endDate
          fsk
        }
      }
      currentMedia {
        ...CurrentMedia
      }
      tracking {
        piano(filter: click)
      }
    }
  }
}

