fragment VideoFragment on Video {
  id
  canonical
  title
  newContentStatus
  sharingUrl
  editorialDate
  productionYear
  contentOwner {
    ...ContentOwner
  }
  availability {
    fskBlocked
    vod {
      visibleTo
      visibleFrom
      endDate
      fsk
    }
  }
  teaser {
    title
    imageWithoutLogo {
      ...ImageFragment
    }
    description
    sourceVariant
    streamAnchorTagId
    externalStreamAnchorTag {
      showEventHighlights
      sceneId
    }
  }
  episodeInfo {
    seasonNumber
    episodeNumber
  }
  structuralMetadata {
    isChildrenContent
  }
  streamingOptions {
    ...NotClickableStreamingOptions
  }
  currentMedia {
    ...CurrentMedia
  }
  scheduledMedia {
    ...ScheduledMedia
  }
  smartCollection {
    canonical
    collectionType
  }
  embeddingPossible
  longInfoText
  tracking {
    piano
    zdf
  }
}

fragment SeasonWithEpisodes on SeasonsConnection {
  nodes {
    id
    title
    number
    countEpisodes
    newContentStatus
    episodes(
      first: $episodesPageSize
      after: $episodesAfter
      sortBy: $episodesSortBy
      filterBy: $episodesFilterBy
    ) {
      nodes {
        ...VideoFragment
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
  pageInfo {
    hasNextPage
    endCursor
  }
}